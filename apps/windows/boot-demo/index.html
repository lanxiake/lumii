<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>灵栖 Lumii — 赛博启动动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Courier New", monospace; }

  :root {
    --primary: #0ff;
    --accent: #ff0080;
    --warning: #ffaa00;
    --success: #00ff88;
    --dark: #0a0e1a;
  }

  #boot {
    position: fixed; inset: 0;
    background: var(--dark); color: var(--primary);
    opacity: 1; transition: opacity 500ms ease;
    overflow: hidden;
  }
  #boot.fading { opacity: 0; pointer-events: none; }

  canvas#fx { position: absolute; inset: 0; width: 100%; height: 100%; }

  .hud {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 24px; font-size: 11px; letter-spacing: .15em;
  }

  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .header-left { opacity: .7; }
  .header-right { text-align: right; opacity: .6; color: var(--warning); }
  .led {
    display: inline-block; width: 4px; height: 4px;
    background: var(--success); border-radius: 50%;
    margin-right: 6px; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  .footer {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    font-size: 10px; line-height: 1.8;
  }
  .term {
    border: 1px solid rgba(0,255,255,.2); padding: 12px;
    background: rgba(0,255,255,.02); max-height: 120px; overflow: hidden;
  }
  .term div { margin: 2px 0; opacity: .7; }
  .term .active { opacity: 1; color: var(--success); }

  .progress-bar {
    margin-top: 20px; height: 2px; background: rgba(0,255,255,.1);
    position: relative; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
    width: 0%; transition: width 300ms ease-out;
    box-shadow: 0 0 10px var(--primary);
  }

  .scanlines {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0,255,255,.02) 0px, rgba(0,255,255,.02) 1px,
      transparent 1px, transparent 2px);
    animation: scanScroll 8s linear infinite;
  }
  @keyframes scanScroll { from { transform: translateY(0); } to { transform: translateY(2px); } }

  .demo-ctrl {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 100; font-size: 11px;
  }
  .demo-ctrl button {
    background: rgba(0,255,255,.1); border: 1px solid var(--primary);
    color: var(--primary); padding: 6px 12px; cursor: pointer; font-family: inherit;
  }
  .demo-ctrl button:hover {
    background: rgba(0,255,255,.2); box-shadow: 0 0 8px var(--primary);
  }
</style>
</head>
<body>

<div id="boot">
  <canvas id="fx"></canvas>
  <div class="scanlines"></div>

  <div class="hud">
    <div class="header">
      <div class="header-left">
        <span class="led"></span>LUMII BOOT LOADER v2.1
      </div>
      <div class="header-right" id="sysInfo">SYSTEM INIT</div>
    </div>

    <div class="footer">
      <div class="term" id="termLeft">
        <div>[*] Kernel loading...</div>
        <div>[*] Modules initialized</div>
      </div>
      <div class="term" id="termRight">
        <div>[OK] Core systems active</div>
        <div class="active">[>>] Ready for commands</div>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progFill"></div>
    </div>
  </div>
</div>

<div class="demo-ctrl">
  <button id="btnPlay">▶ 播放</button>
  <button id="btnStop">⏹ 停止</button>
  <label><input type="checkbox" id="chkSound" checked /> 声音</label>
</div>

<script>
const W = window.innerWidth, H = window.innerHeight;
const CX = W / 2, CY = H / 2;
const cv = document.getElementById('fx');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

let running = false;
let elapsed = 0;
let dt = 0;
let lastT = performance.now();
let codes = [];

// ── 代码雨 ────────────────────────────────────────
function createCodeRain() {
  codes = [];
  for (let i = 0; i < 150; i++) {
    codes.push({
      x: Math.random() * W,
      y: -50 - Math.random() * H,
      speed: 40 + Math.random() * 120,
      char: '0123456789ABCDEF'[Math.floor(Math.random() * 16)],
      opacity: 0.3 + Math.random() * 0.7,
      size: 11 + Math.random() * 6,
    });
  }
}

function drawCodeRain(alpha) {
  if (alpha < 0.01) return;
  ctx.fillStyle = `rgba(0,255,255,${(alpha * 0.6).toFixed(3)})`;
  for (const c of codes) {
    c.y += c.speed * dt;
    if (c.y > H + 50) {
      c.y = -50;
      c.x = Math.random() * W;
    }
    ctx.font = `bold ${c.size}px Courier New`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = c.opacity * alpha;
    ctx.fillText(c.char, c.x, c.y);
  }
  ctx.globalAlpha = 1;
}

// ── 网格 ──────────────────────────────────────────
function drawGrid(alpha) {
  if (alpha < 0.01) return;
  ctx.strokeStyle = `rgba(0,255,255,${(alpha * 0.2).toFixed(3)})`;
  ctx.lineWidth = 0.5;

  for (let i = -5; i < 15; i++) {
    const y = CY + i * 50;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

// ── 能量线 ────────────────────────────────────────
function drawEnergyLines(alpha) {
  if (alpha < 0.01) return;

  for (let i = 0; i < 24; i++) {
    const angle = (i / 24) * Math.PI * 2;
    const wave = Math.sin(elapsed * 2.5 + i * 0.3);
    const dist = 300 + wave * 80;

    const fromX = CX + Math.cos(angle) * dist;
    const fromY = CY + Math.sin(angle) * dist;
    const toX = CX + Math.cos(angle) * 60 * alpha;
    const toY = CY + Math.sin(angle) * 60 * alpha;

    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(toX, toY);
    ctx.strokeStyle = `rgba(0,255,255,${(alpha * (0.4 + 0.6 * Math.abs(wave))).toFixed(3)})`;
    ctx.lineWidth = 1.5 + alpha;
    ctx.stroke();
  }
}

// ── 粒子聚合 ──────────────────────────────────────
let particles = [];
function initParticles() {
  particles = [];
  for (let i = 0; i < 250; i++) {
    const angle = (i / 250) * Math.PI * 2;
    const r = 80 + Math.random() * 180;
    particles.push({
      x: CX + Math.cos(angle) * r,
      y: CY + Math.sin(angle) * r,
      tx: CX + Math.cos(angle) * 50,
      ty: CY + Math.sin(angle) * 50,
      size: 0.5 + Math.random() * 2,
    });
  }
}

function drawParticles(alpha) {
  if (alpha < 0.05 || !particles.length) {
    if (alpha >= 0.05 && !particles.length) initParticles();
    return;
  }

  const easing = Math.min(1, alpha * 1.5);
  for (const p of particles) {
    p.x += (p.tx - p.x) * easing * 0.1;
    p.y += (p.ty - p.y) * easing * 0.1;

    const hue = Math.floor(easing * 360);
    ctx.fillStyle = `hsla(${hue}, 100%, 50%, ${(alpha * 0.7).toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── 脉冲环 ────────────────────────────────────────
function drawPulseRings(alpha) {
  if (alpha < 0.01) return;

  for (let k = 0; k < 8; k++) {
    const delay = k * 0.1;
    const t = (elapsed * 2 - delay) % 1.3;
    if (t < 0 || t > 1) continue;

    const r = 80 + t * 250;
    const lineAlpha = (1 - t) * alpha;

    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,0,128,${lineAlpha.toFixed(3)})`;
    ctx.lineWidth = 2 * (1 - t) + 0.5;
    ctx.stroke();
  }
}

// ── 核心光晕 ──────────────────────────────────────
function drawCoreGlow(alpha) {
  if (alpha < 0.05) return;

  const pulse = Math.sin(elapsed * 3) * 0.5 + 0.5;
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 250);
  g.addColorStop(0, `rgba(0,255,255,${(alpha * pulse * 0.5).toFixed(3)})`);
  g.addColorStop(1, 'rgba(0,255,255,0)');

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(CX, CY, 250, 0, Math.PI * 2);
  ctx.fill();
}

// ── 主循环 ────────────────────────────────────────
function frame(now) {
  dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (running) {
    elapsed += dt;
    if (elapsed > 6.5) {
      running = false;
      document.getElementById('boot').classList.add('fading');
    }
  }

  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);

  // 阶段计算
  const initAlpha = Math.min(1, elapsed / 1.5);
  const loadAlpha = Math.max(0, Math.min(1, (elapsed - 1.5) / 2.5));
  const readyAlpha = Math.max(0, Math.min(1, (elapsed - 4.0) / 2.5));

  // 绘制
  drawGrid(initAlpha * 0.4);
  drawCodeRain(initAlpha);
  drawEnergyLines(loadAlpha * 0.9);
  drawParticles(loadAlpha * 0.8);
  drawCoreGlow(readyAlpha * 0.7);
  drawPulseRings(readyAlpha);

  // 进度条
  const progress = Math.min(100, (elapsed / 6.5) * 100);
  document.getElementById('progFill').style.width = progress + '%';

  // 信息更新
  const stage = elapsed < 1.5 ? 'INIT' : elapsed < 4.0 ? 'LOAD' : 'READY';
  document.getElementById('sysInfo').textContent = `[ ${stage} ]`;

  requestAnimationFrame(frame);
}

// ── 控制 ──────────────────────────────────────────
document.getElementById('btnPlay').onclick = () => {
  if (running) return;
  running = true;
  elapsed = 0;
  codes = [];
  createCodeRain();
  document.getElementById('boot').classList.remove('fading');
};

document.getElementById('btnStop').onclick = () => {
  running = false;
  elapsed = 0;
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);
};

// 启动循环
requestAnimationFrame(frame);

// 自动开始（可注释掉）
setTimeout(() => {
  running = true;
  createCodeRain();
}, 500);
</script>

</body>
</html>
