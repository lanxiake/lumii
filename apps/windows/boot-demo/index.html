<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>灵栖启动动画</title>
<style>
body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
canvas { display: block; width: 100vw; height: 100vh; background: #0a0e1a; }
.ui { position: fixed; top: 20px; left: 20px; color: #0ff; font-size: 12px; z-index: 10; }
.btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); }
button { background: rgba(0,255,255,0.1); color: #0ff; border: 1px solid #0ff; padding: 8px 16px; font-size: 12px; cursor: pointer; margin: 0 5px; }
button:hover { background: rgba(0,255,255,0.3); }
.prog { position: fixed; bottom: 60px; left: 50%; width: 300px; transform: translateX(-50%); height: 2px; background: rgba(0,255,255,0.2); }
.prog-fill { height: 100%; background: linear-gradient(90deg, #0ff, #ff0080); width: 0%; box-shadow: 0 0 10px #0ff; }
</style>
</head>
<body>

<div class="ui">
  <div id="info">[ INIT ]</div>
  <div id="prog" style="margin-top: 10px;">0%</div>
</div>

<div class="prog">
  <div class="prog-fill" id="progFill"></div>
</div>

<div class="btn">
  <button onclick="start()">▶ 开始</button>
  <button onclick="stop()">⏹ 停止</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;

let running = false;
let time = 0;
let dt = 0;
let lastT = 0;
let codes = [];

function createCodes() {
  codes = [];
  for (let i = 0; i < 200; i++) {
    codes.push({
      x: Math.random() * W,
      y: Math.random() * H - H,
      vy: 30 + Math.random() * 100,
      char: Math.floor(Math.random() * 16).toString(16).toUpperCase(),
      size: 12 + Math.random() * 5,
      opacity: 0.3 + Math.random() * 0.5
    });
  }
}

function drawFrame() {
  // 清屏
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);

  if (!running) {
    requestAnimationFrame(drawFrame);
    return;
  }

  // 阶段计算
  const initPhase = Math.min(1, time / 1.5);
  const loadPhase = Math.max(0, Math.min(1, (time - 1.5) / 2.5));
  const readyPhase = Math.max(0, Math.min(1, (time - 4.0) / 2.5));

  // 代码雨
  if (initPhase > 0) {
    ctx.fillStyle = 'rgba(0,255,255,' + (initPhase * 0.5) + ')';
    for (const c of codes) {
      c.y += c.vy * dt;
      if (c.y > H) {
        c.y = -50;
        c.x = Math.random() * W;
      }
      ctx.font = 'bold ' + c.size + 'px monospace';
      ctx.textAlign = 'center';
      ctx.globalAlpha = c.opacity * initPhase;
      ctx.fillText(c.char, c.x, c.y);
    }
    ctx.globalAlpha = 1;
  }

  // 网格
  if (initPhase > 0) {
    ctx.strokeStyle = 'rgba(0,255,255,' + (initPhase * 0.15) + ')';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 15; i++) {
      ctx.beginPath();
      ctx.moveTo(0, CY + (i - 7) * 50);
      ctx.lineTo(W, CY + (i - 7) * 50);
      ctx.stroke();
    }
  }

  // 能量线
  if (loadPhase > 0) {
    for (let i = 0; i < 24; i++) {
      const angle = (i / 24) * Math.PI * 2;
      const wave = Math.sin(time * 2.5);
      const dist = 300 + wave * 80;

      const x1 = CX + Math.cos(angle) * dist;
      const y1 = CY + Math.sin(angle) * dist;
      const x2 = CX + Math.cos(angle) * 60 * loadPhase;
      const y2 = CY + Math.sin(angle) * 60 * loadPhase;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(0,255,255,' + (loadPhase * 0.6) + ')';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // 粒子汇聚
  if (loadPhase > 0) {
    for (let i = 0; i < 200; i++) {
      const angle = (i / 200) * Math.PI * 2;
      const r1 = 100 + Math.random() * 150;
      const r2 = 50;

      const x = CX + Math.cos(angle) * (r1 + (r2 - r1) * loadPhase * 1.5);
      const y = CY + Math.sin(angle) * (r1 + (r2 - r1) * loadPhase * 1.5);

      const hue = (i / 200 * 360 + time * 50) % 360;
      ctx.fillStyle = 'hsl(' + hue + ',100%,50%)';
      ctx.globalAlpha = loadPhase * 0.7;
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 核心光晕
  if (readyPhase > 0) {
    const pulse = Math.sin(time * 3) * 0.5 + 0.5;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 200);
    g.addColorStop(0, 'rgba(0,255,255,' + (readyPhase * pulse * 0.5) + ')');
    g.addColorStop(1, 'rgba(0,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(CX, CY, 200, 0, Math.PI * 2);
    ctx.fill();
  }

  // 脉冲环
  if (readyPhase > 0) {
    for (let k = 0; k < 8; k++) {
      const t = (time * 2 - k * 0.1) % 1.3;
      if (t >= 0 && t <= 1) {
        const r = 80 + t * 250;
        ctx.beginPath();
        ctx.arc(CX, CY, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,0,128,' + ((1 - t) * readyPhase) + ')';
        ctx.lineWidth = 2 * (1 - t) + 0.5;
        ctx.stroke();
      }
    }
  }

  // 更新UI
  const stage = time < 1.5 ? 'INIT' : time < 4 ? 'LOAD' : 'READY';
  document.getElementById('info').textContent = '[ ' + stage + ' ]';

  const progress = Math.min(100, (time / 6.5) * 100);
  document.getElementById('prog').textContent = Math.floor(progress) + '%';
  document.getElementById('progFill').style.width = progress + '%';

  time += dt;

  if (time > 6.5) {
    running = false;
  }

  requestAnimationFrame(drawFrame);
}

function start() {
  running = true;
  time = 0;
  createCodes();
}

function stop() {
  running = false;
  time = 0;
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);
}

// 启动主循环
let lastFrameT = performance.now();
function mainLoop(now) {
  dt = (now - lastFrameT) / 1000;
  lastFrameT = now;
  dt = Math.min(dt, 0.05);
  drawFrame();
  requestAnimationFrame(mainLoop);
}

// 自动开始
setTimeout(() => {
  start();
}, 800);

requestAnimationFrame(mainLoop);
</script>

</body>
</html>
