<!--
黑底高级信息图模板 · 对标公众号爆款(纵所周知/像素与咖啡)的商务高级风
用途:概念/原理/数据的高级感呈现,比白底手绘讲义风更商务、与科技封面更统一
风格:纯黑底 + 细白线圆形节点 + 大数字/大词 + 霓虹蓝青描边 + 橙色点睛
用法:改标题和节点内容,截图 .wrap
  python scripts/screenshot.py templates/dark-infographic.html out.png .wrap 2000 1000 760
适用布局:中心辐射(一个核心+四周节点) / 横向流程 / 分级列表卡
-->
<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<style>
  body{margin:0;background:#0a0a0f;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{width:760px;box-sizing:border-box;padding:34px 36px 40px;background:radial-gradient(ellipse at top,#13131f 0%,#0a0a0f 70%);}
  .ttl{text-align:center;font-size:30px;font-weight:bold;color:#fff;letter-spacing:1px;margin-bottom:6px;}
  .sub{text-align:center;font-size:15px;color:#8a8a9a;margin-bottom:30px;}
  /* 卡片列表式(分级/排名),对标篇B */
  .card{display:flex;align-items:center;gap:16px;border:1.5px solid rgba(90,160,255,.35);border-radius:14px;padding:15px 20px;margin:13px 0;background:linear-gradient(135deg,rgba(30,40,70,.5),rgba(15,18,30,.5));box-shadow:0 0 18px rgba(60,130,255,.08) inset;}
  .rank{font-size:26px;font-weight:bold;color:#5aa0ff;min-width:46px;text-align:center;}
  .ci{font-size:24px;min-width:34px;text-align:center;}
  .cmain{flex:1;}
  .cname{font-size:18px;font-weight:bold;color:#fff;}
  .cdesc{font-size:13px;color:#9a9aaa;margin-top:3px;}
  .ctag{font-size:12px;color:#ffb060;border:1px solid rgba(255,140,60,.4);border-radius:6px;padding:2px 9px;white-space:nowrap;}
  .top{border-color:rgba(255,180,60,.55);box-shadow:0 0 22px rgba(255,180,60,.12) inset;}
  .top .rank{color:#ffb84d;}
  .foot{text-align:center;font-size:17px;color:#fff;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);}
  .em{color:#ffb060;font-weight:bold;}
  .glow{color:#5aa0ff;}
</style></head>
<body>
<div class="wrap">
  <div class="ttl">【标题】</div>
  <div class="sub">【副标题/一句话定位】</div>

  <div class="card top">
    <div class="rank">#1</div><div class="ci">⚡</div>
    <div class="cmain"><div class="cname">【条目一】</div><div class="cdesc">【一句话说明】</div></div>
    <div class="ctag">【标签】</div>
  </div>
  <div class="card">
    <div class="rank">#2</div><div class="ci">🔧</div>
    <div class="cmain"><div class="cname">【条目二】</div><div class="cdesc">【说明】</div></div>
    <div class="ctag">【标签】</div>
  </div>
  <div class="card">
    <div class="rank">#3</div><div class="ci">🎯</div>
    <div class="cmain"><div class="cname">【条目三】</div><div class="cdesc">【说明】</div></div>
    <div class="ctag">【标签】</div>
  </div>

  <div class="foot">一句话：<span class="em">【金句】</span></div>
</div>
</body></html>
