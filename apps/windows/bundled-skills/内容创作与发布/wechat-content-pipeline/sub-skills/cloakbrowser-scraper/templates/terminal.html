<!--
终端运行效果模板 · 模拟命令行程序输出
用途：展示"程序跑起来"的真实成果,比真实截图更可控(中文对齐不乱)
用法：改命令行和输出内容,截图 .term 元素
  python scripts/screenshot.py templates/terminal.html out.png .term
配色：暗色终端,收入蓝 #89b4fa,支出红 #f38ba8,高亮橙 #fab387,成功绿 #1a7f37
-->
<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<style>
  body{margin:0;background:#1e1e2e;font-family:"Cascadia Code","Consolas","Menlo",monospace;}
  .term{width:680px;box-sizing:border-box;margin:0 auto;background:#11111b;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .bar{background:#313244;padding:10px 14px;display:flex;gap:8px;align-items:center;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .r{background:#f38ba8}.y{background:#f9e2af}.g{background:#a6e3a1}
  .title{color:#cdd6f4;font-size:13px;margin-left:10px;}
  pre{margin:0;padding:20px;color:#cdd6f4;font-size:15px;line-height:1.7;white-space:pre;}
  .cmd{color:#a6e3a1}.hl{color:#fab387;font-weight:bold}.dim{color:#6c7086}.in{color:#89b4fa}.ex{color:#f38ba8}
</style></head>
<body>
<div class="term">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">终端 — 【程序名】</span></div>
<pre><span class="cmd">$ python 【程序文件名】.py</span>

======================================
        <span class="hl">【程序标题】</span>
======================================
<span class="dim">【表头或分隔线】</span>
【正文输出行,收入用 <span class="in">+数字</span>,支出用 <span class="ex">-数字</span>】
<span class="dim">--------------------------------------</span>
【汇总行：<span class="in">+合计</span> / <span class="ex">-合计</span>】
结果：<span class="hl">【高亮的关键结果】</span>
======================================
<span class="cmd">$ </span><span style="background:#cdd6f4;color:#cdd6f4">_</span>
</pre>
</div>
</body></html>
