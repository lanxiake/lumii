<!--
AI 对话打字机模板 · 模拟"发提示词 → AI 逐字回复 → 生成完成"
用途：展示人机协作过程,带 JS 打字动画。可静态截图(末帧),也可录成 GIF。
用法：
  改 USER_MSG / TYPE_TEXT / CODE_LINES / OK_TEXT 四处文案
  录 GIF:  python scripts/html_to_gif.py templates/ai-chat.html out.gif 42 130 600 340
  截末帧:  python scripts/screenshot.py templates/ai-chat.html out.png .chat (需等打字完成,先调大 wait)
风格：微信聊天气泡,用户绿 #95ec69,AI 白底,代码块暗色
-->
<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<style>
  body{margin:0;background:#ece5dd;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  .chat{width:600px;box-sizing:border-box;padding:18px;}
  .row{display:flex;margin:12px 0;gap:10px;align-items:flex-start;}
  .row.me{flex-direction:row-reverse;}
  .av{width:38px;height:38px;border-radius:8px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;}
  .av.ai{background:#1a3a5c;color:#fff;}
  .av.me{background:#ff6b35;color:#fff;}
  .bub{max-width:430px;padding:11px 14px;border-radius:12px;font-size:15px;line-height:1.65;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .ai .bub{background:#fff;color:#222;border-top-left-radius:2px;}
  .me .bub{background:#95ec69;color:#222;border-top-right-radius:2px;}
  .code{background:#2d2d2d;color:#9cdcfe;font-family:Consolas,monospace;font-size:13px;padding:8px 10px;border-radius:6px;margin-top:6px;white-space:pre-wrap;}
  .ok{display:inline-block;margin-top:8px;color:#1a7f37;font-weight:bold;}
  .cursor{display:inline-block;width:7px;height:16px;background:#1a3a5c;vertical-align:-3px;animation:bk .6s steps(1) infinite;}
  @keyframes bk{50%{opacity:0}}
  .hide{display:none;}
</style></head>
<body>
<div class="chat" id="chat">
  <div class="row me"><div class="av me">我</div><div class="bub" id="userMsg">【用户发的提示词,改这里】</div></div>
  <div class="row ai"><div class="av ai">AI</div><div class="bub"><span id="ai"></span><span class="cursor" id="cur"></span></div></div>
</div>
<script>
// === 改这四处文案 ===
const TYPE_TEXT = "好的！我来帮你完成。\n已创建文件，包含：\n";   // AI 逐字打出的话
const CODE_LINES = "✓ 功能点一\n✓ 功能点二\n✓ 功能点三";          // 暗色代码块里列的内容
const OK_TEXT = "✅ 完成，按说明运行即可查看效果";                 // 绿色完成提示
// ====================
const el=document.getElementById('ai'),cur=document.getElementById('cur');
let i=0;
function type(){
  if(i<TYPE_TEXT.length){el.textContent+=TYPE_TEXT[i];i++;setTimeout(type,55);}
  else{
    const c=document.createElement('div');c.className='code';c.textContent=CODE_LINES;el.parentNode.insertBefore(c,cur);
    const ok=document.createElement('div');ok.className='ok';ok.textContent=OK_TEXT;el.parentNode.insertBefore(ok,cur);
    cur.classList.add('hide');
  }
}
setTimeout(type,700);
</script>
</body></html>
