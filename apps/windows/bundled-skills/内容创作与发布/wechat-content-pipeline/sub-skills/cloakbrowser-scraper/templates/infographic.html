<!--
信息图模板 · 黑白手绘讲义风(对标《风声的AI编程》)
用途：把抽象概念/架构/流程做成专业信息图,文字零乱码(HTML 精确控制,不让 AI 生成中文)
用法：改下面的标题/副标题/层级内容,用 CloakBrowser 截图 .wrap 元素
  python scripts/screenshot.py templates/infographic.html out.png .wrap
风格要点：手写体标题 + 圆角黑框分区 + 橙色虚线角色标注 + 圆圈序号 + 一句话总结
品牌色：橙 #ff6b35 / 深蓝 #1a3a5c
-->
<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Long+Cang&display=swap');
  body{margin:0;background:#fbfbf7;font-family:"Long Cang","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{width:720px;box-sizing:border-box;padding:28px 30px;}
  .ttl{text-align:center;font-size:30px;font-weight:bold;color:#1a1a1a;margin-bottom:6px;letter-spacing:2px;}
  .sub{text-align:center;font-size:16px;color:#666;margin-bottom:24px;}
  .layer{border:2.5px solid #222;border-radius:14px;padding:16px 18px;margin:16px 0;position:relative;background:#fff;box-shadow:3px 3px 0 #e8e8e0;}
  .num{position:absolute;left:-15px;top:-15px;width:38px;height:38px;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;}
  .lh{font-size:23px;font-weight:bold;color:#1a1a1a;margin-bottom:4px;}
  .ld{font-size:16px;color:#444;line-height:1.5;}
  .role{display:inline-block;background:#fff3ec;border:2px dashed #ff6b35;color:#d2531f;border-radius:8px;padding:3px 12px;font-size:16px;margin:8px 0;}
  .ex{font-size:15px;color:#777;margin-top:6px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  .arrow{text-align:center;font-size:26px;color:#999;margin:-6px 0;}
  .sum{text-align:center;font-size:19px;color:#1a1a1a;margin-top:22px;font-family:'PingFang SC';}
  .em{color:#d2531f;font-weight:bold;}
</style></head>
<body>
<div class="wrap">
  <div class="ttl">【在这里写标题】</div>
  <div class="sub">【副标题/一句话定位】</div>

  <div class="layer">
    <div class="num">1</div>
    <div class="lh">【概念一 · 一句话定性】</div>
    <span class="role">就像 → 【生活类比角色】</span>
    <div class="ld">【这个概念负责什么,一句话】</div>
    <div class="ex">📱 【放到具体场景里 = ……】</div>
  </div>

  <div class="arrow">↓</div>

  <div class="layer">
    <div class="num">2</div>
    <div class="lh">【概念二】</div>
    <span class="role">就像 → 【类比】</span>
    <div class="ld">【说明】</div>
    <div class="ex">⚙️ 【场景示例】</div>
  </div>

  <div class="arrow">↓</div>

  <div class="layer">
    <div class="num">3</div>
    <div class="lh">【概念三】</div>
    <span class="role">就像 → 【类比】</span>
    <div class="ld">【说明】</div>
    <div class="ex">📒 【场景示例】</div>
  </div>

  <div class="sum">一句话：<span class="em">【浓缩成一句金句】</span></div>
</div>
</body></html>
