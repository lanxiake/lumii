<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>闲鱼商品图源文件</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9edf3}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#root{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px}
.poster{
  width:1024px;height:1024px;position:relative;overflow:hidden;flex:0 0 auto;
  padding:54px 56px 42px;display:flex;flex-direction:column;color:#0f172a;
  background-size:cover;background-position:center;
}
.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.80) 0%,rgba(255,255,255,.56) 48%,rgba(255,255,255,.84) 100%);z-index:0}
.poster>*{position:relative;z-index:1}
.head{flex:0 0 auto}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:var(--accent);letter-spacing:.02em}
.kdot{width:10px;height:10px;border-radius:3px;background:var(--accent);flex:0 0 auto}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:800;line-height:1.2;margin-left:10px}
.tag-live{color:#047857;background:#d1fae5}
.tag-demo{color:#92400e;background:#fef3c7}
.tag-soft{color:var(--accent);background:var(--soft)}
.title{font-size:60px;line-height:1.16;font-weight:900;letter-spacing:-.03em;margin:12px 0 10px;max-width:930px}
.title b{color:var(--accent);font-weight:900}
.sub{font-size:24px;line-height:1.48;color:#334155;font-weight:500;max-width:900px;margin:0}
.stage{position:relative;flex:1 1 auto;margin-top:18px;min-height:0;display:flex;flex-direction:column}
.stage>.win,.stage>.metrics+.win{flex:1;min-height:0}
.foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#64748b;margin-top:16px;font-weight:600}
.foot .pill{border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.72);border-radius:999px;padding:5px 12px;color:#475569}

/* window */
.win{background:rgba(255,255,255,.97);border:1px solid rgba(15,23,42,.08);border-radius:18px;box-shadow:0 26px 60px -24px rgba(15,23,42,.30),0 4px 14px rgba(15,23,42,.06);overflow:hidden;display:flex;flex-direction:column}
.win-bar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #eef2f7;background:linear-gradient(180deg,#fff,#f8fafc)}
.app-ico{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.win-bar .t{font-size:16px;font-weight:800;color:#1f2937}
.win-bar .s{margin-left:auto;font-size:13px;font-weight:800;color:#047857;background:#ecfdf5;border-radius:999px;padding:4px 10px;white-space:nowrap}
.win-bar .s.warn{color:#9a3412;background:#fff7ed}
.win-body{padding:16px 18px;flex:1;min-height:0;display:flex;flex-direction:column}
.win-body.tight{padding:12px 14px}

/* generic rows */
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .name{font-size:15px;font-weight:800;color:#1f2937;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .msg{font-size:13px;color:#64748b;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.avatar{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex:0 0 auto}
.unread{min-width:26px;height:26px;border-radius:999px;background:#ef4444;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 8px;flex:0 0 auto}
.unread.zero{background:#e2e8f0;color:#64748b}
.time{font-size:12px;color:#94a3b8;flex:0 0 auto}

/* two pane */
.panes{display:grid;grid-template-columns:44% 56%;gap:0;flex:1;min-height:0}
.pane{padding:14px 16px;min-height:0;display:flex;flex-direction:column}
.pane+.pane{border-left:1px solid #eef2f7;background:#fbfdff}
.pane-h{font-size:13px;font-weight:900;color:#64748b;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.assist{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;flex:1;min-height:0}
.assist-line{display:flex;gap:10px;font-size:14px;line-height:1.55;color:#334155;padding:5px 0}
.num{width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.draft{margin-top:auto;background:#fff;border:1px solid #e2e8f0;border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55;color:#334155}
.draft .btns{display:flex;gap:8px;margin-top:8px}
.btn{font-size:12px;font-weight:800;border-radius:8px;padding:5px 10px;background:var(--accent);color:#fff}
.btn.ghost{background:#fff;color:#64748b;border:1px solid #e2e8f0}

/* callouts */
.callout{position:absolute;z-index:5;background:#fff;border:2px solid var(--accent);color:var(--accent);border-radius:14px;padding:9px 13px;font-size:18px;font-weight:900;box-shadow:0 12px 26px rgba(15,23,42,.16);line-height:1.25;white-space:nowrap}
.callout small{display:block;font-size:12px;color:#64748b;font-weight:700;margin-top:1px}
.callout.plain{border-color:rgba(15,23,42,.10);color:#0f172a;box-shadow:0 12px 26px rgba(15,23,42,.10)}
.callout .big{font-size:30px;line-height:1}

/* metrics */
.metrics{display:grid;gap:12px;margin-bottom:12px}
.metrics.c3{grid-template-columns:repeat(3,1fr)}
.metrics.c4{grid-template-columns:repeat(4,1fr)}
.metric{background:rgba(255,255,255,.97);border:1px solid rgba(15,23,42,.08);border-radius:15px;padding:13px 15px;box-shadow:0 12px 26px -16px rgba(15,23,42,.24)}
.metric .n{font-size:40px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-.02em}
.metric.c4 .n{font-size:34px}
.metric .l{font-size:14px;font-weight:800;color:#334155;margin-top:6px}
.metric .x{font-size:12px;color:#64748b;margin-top:2px}

/* bars */
.bars{display:flex;flex-direction:column;gap:13px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:800;color:#334155;margin-bottom:6px}
.bar-top .v{color:var(--accent);font-size:18px}
.bar-track{height:14px;background:#eef2f7;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--accent)}
.bar-fill.muted{background:#cbd5e1}
.bar-fill.warm{background:#f59e0b}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:#64748b;font-weight:800;background:#f8fafc;padding:7px 9px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.tbl td{padding:7px 9px;border-bottom:1px solid #f1f5f9;color:#334155;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .hi{color:var(--accent);font-weight:800}

/* tree */
.tree{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.ti{display:flex;align-items:center;gap:9px;color:#334155;font-weight:700}
.ti .ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);flex:0 0 auto}
.ti .meta{margin-left:auto;color:#94a3b8;font-size:12px;font-weight:600}
.ti.d1{padding-left:26px}
.ti.d2{padding-left:52px}
.ti .ok{color:#059669;font-size:13px;font-weight:800;margin-left:6px}

/* comparison */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
.side{background:rgba(255,255,255,.97);border:1px solid rgba(15,23,42,.08);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px -22px rgba(15,23,42,.28)}
.side .lab{padding:9px 14px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
.side.before .lab{background:#f1f5f9;color:#64748b}
.side.after .lab{background:var(--soft);color:var(--accent)}
.side .bd{padding:12px 14px;flex:1;min-height:0;display:flex;flex-direction:column}

/* bubbles */
.bubble{max-width:86%;padding:9px 12px;border-radius:11px;font-size:13.5px;line-height:1.5;margin-bottom:8px}
.bubble.me{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:#f1f5f9;color:#1f2937;border-bottom-left-radius:4px}
.sys{text-align:center;font-size:12px;color:#94a3b8;margin:8px 0}

/* flow */
.flow{display:flex;align-items:stretch;gap:10px}
.step{flex:1;background:rgba(255,255,255,.97);border:1px solid rgba(15,23,42,.08);border-radius:15px;padding:13px;box-shadow:0 12px 26px -18px rgba(15,23,42,.22)}
.step .sn{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.step .h{font-size:15px;font-weight:900;color:#1f2937}
.step .p{font-size:12.5px;color:#64748b;line-height:1.5;margin-top:3px}
.arrow{display:flex;align-items:center;color:#cbd5e1;flex:0 0 auto}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:#e2e8f0}
.tli{position:relative;margin-bottom:12px}
.tli:last-child{margin-bottom:0}
.tli::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.tli.gray::before{border-color:#cbd5e1}
.tli .tm{font-size:12px;color:#94a3b8;font-weight:700}
.tli .tx{font-size:14px;color:#334155;line-height:1.45;margin-top:2px}
.tli .tx b{color:#0f172a}

/* document preview */
.doc{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;box-shadow:0 8px 18px rgba(15,23,42,.06);flex:1;min-height:0;display:flex;flex-direction:column}
.doc-h{font-size:15px;font-weight:900;color:#1f2937;border-bottom:1px solid #eef2f7;padding-bottom:7px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.doc-h .m{font-size:11.5px;color:#94a3b8;font-weight:700}
.doc-img{background:linear-gradient(135deg,#dbeafe,#e0e7ff);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:11px;font-weight:800}
.doc-img.green{background:linear-gradient(135deg,#d1fae5,#ecfdf5)}
.doc-img.amber{background:linear-gradient(135deg,#fef3c7,#ffedd5)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12.5px;font-weight:800;border-radius:999px;padding:4px 10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.chip.on{background:var(--soft);color:var(--accent);border-color:transparent}

/* misc */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;color:#334155;line-height:1.5}
.kv .k{color:#64748b}
.kv .v{font-weight:700;text-align:right}
.note{border-radius:10px;background:var(--soft);color:var(--accent);padding:9px 12px;font-size:13px;font-weight:800;line-height:1.5}
.green{color:#059669}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.flex1{flex:1;min-height:0}
.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);border-radius:11px;padding:9px 12px;background:#fff}
.search .q{font-size:15px;font-weight:800;color:#1f2937}
.search .k{margin-left:auto;font-size:12px;color:#64748b;font-weight:700}
.hit{padding:9px 0;border-bottom:1px solid #f1f5f9}
.hit:last-child{border-bottom:0}
.hit .h{font-size:13.5px;font-weight:800;color:#1f2937}
.hit .s{font-size:12.5px;color:#64748b;line-height:1.5;margin-top:2px}
.hit mark{background:#fef08a;color:#713f12;padding:0 2px;border-radius:2px}
[data-out="export-archive/04"] .hit{padding:7px 0}
[data-out="message-retention/04"] .sys{margin:5px 0}
[data-out="message-retention/01"] .tli{margin-bottom:10px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS = {
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  mic:'<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  table:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  arrow:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
};
const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;
const avatar=(t,c)=>`<div class="avatar" style="background:${c}">${t}</div>`;
const chatRow=(name,msg,count,color,time)=>`<div class="row">${avatar(name.slice(0,1),color)}<div class="grow"><div class="name">${name}</div><div class="msg">${msg}</div></div>${time?`<span class="time">${time}</span>`:''}${count===0?'<span class="unread zero">0</span>':`<span class="unread">${count}</span>`}</div>`;
const metric=(n,l,x,cls='')=>`<div class="metric ${cls}"><div class="n">${n}</div><div class="l">${l}</div>${x?`<div class="x">${x}</div>`:''}</div>`;
const bar=(l,v,w,cls='',note='')=>`<div><div class="bar-top"><span>${l}</span><span class="v">${v}</span></div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${w}%"></div></div>${note?`<div class="x" style="font-size:12px;color:#94a3b8;margin-top:3px">${note}</div>`:''}</div>`;
const win=(title,status,body,opts={})=>`<div class="win ${opts.cls||''}" style="${opts.style||''}"><div class="win-bar"><span class="app-ico">${ico(opts.icon||'chat',16)}</span><span class="t">${title}</span>${status?`<span class="s ${opts.warn?'warn':''}">${status}</span>`:''}</div><div class="win-body ${opts.tight?'tight':''}">${body}</div></div>`;
const poster=(out,o)=>`<section class="poster" data-out="${out}" style="--accent:${o.accent};--soft:${o.soft};background-image:url('./images/_bg/${o.bg}.png')">
<header class="head">
  <div class="kicker"><span class="kdot"></span>${o.kicker}${o.tag?`<span class="tag ${o.tagCls||'tag-soft'}">${o.tag}</span>`:''}</div>
  <h1 class="title">${o.title}</h1>
  <p class="sub">${o.sub}</p>
</header>
<div class="stage">${o.stage}</div>
<footer class="foot"><span>${o.foot||'本机实测 · 联系人与数据已打码'}</span><span class="pill">${o.footR||'Win10 / 11 · 64 位'}</span></footer>
</section>`;

const posters=[
/* ============ 01 消息助手 ============ */
poster('message-assistant/01',{
  accent:'#2563eb',soft:'#eff6ff',bg:'01-blue',kicker:'功能亮点',tag:'实测',tagCls:'tag-live',
  title:'132 个未读<br><b>一句话列清</b>',
  sub:'不用逐个点开，先看谁在等、等什么。',
  foot:'本机实测 2026-10-14 · 132 个未读会话',
  stage:`
  <div style="position:absolute;inset:0">
    ${win('消息助手 · 未读汇总','2.05 秒',`
      <div class="panes" style="flex:1">
        <div class="pane">
          <div class="pane-h">${ico('chat',14)} 全部会话</div>
          ${chatRow('客户 · 王**','合同盖章页已发，麻烦确认','3','#2563eb','10:42')}
          ${chatRow('项目群 · 交付','今晚 8 点前发版','28','#7c3aed','10:38')}
          ${chatRow('老板 · 周**','上午的报表再看一下','2','#0f766e','10:31')}
          ${chatRow('家人','周末回来吃饭吗','1','#ea580c','10:12')}
          ${chatRow('供应商 · 李**','样品周五到','4','#475569','09:56')}
          ${chatRow('设计外包 · 陈**','第二版初稿发你了','6','#be123c','09:41')}
          ${chatRow('同学群','周末聚一下','12','#0891b2','08:20')}
        </div>
        <div class="pane">
          <div class="pane-h">${ico('zap',14)} AI 整理结果</div>
          <div class="assist" style="display:flex;flex-direction:column">
            <div class="assist-line"><span class="num">1</span><div><b>客户 · 王**</b> 3 条未读：合同盖章页、开票信息、交期确认</div></div>
            <div class="assist-line"><span class="num">2</span><div><b>项目群</b> 28 条未读：今晚 8 点发版，需要你回「收到」</div></div>
            <div class="assist-line"><span class="num">3</span><div><b>老板</b> 2 条未读：报表第 3 页数据要改</div></div>
            <div class="assist-line"><span class="num" style="background:#94a3b8">4</span><div><b>供应商 · 李**</b> 4 条未读：样品周五到，需确认收货地址</div></div>
            <div class="assist-line"><span class="num" style="background:#cbd5e1">5</span><div><b>其余 3 个会话</b> 共 19 条：广告、闲聊，可稍后处理</div></div>
            <div class="draft">先回这 3 个会话，其余 4 个可以稍后处理。
              <div class="btns"><span class="btn">按优先级排列</span><span class="btn ghost">看原文</span></div>
            </div>
            <div class="mt12" style="margin-top:auto">
              <div style="font-size:12px;font-weight:900;color:#64748b;margin-bottom:6px">未读分布</div>
              <div class="bars" style="gap:8px">
                ${bar('客户', '3 个会话', 22)}
                ${bar('项目群', '1 个会话 · 28 条', 68)}
                ${bar('内部 / 家人', '2 个会话 · 3 条', 14, 'muted')}
                ${bar('其他', '3 个会话 · 19 条', 34, 'muted')}
              </div>
            </div>

        <div class="note mt12" style="margin-top:auto">不承诺「能当证据」<br>只提供本机记录</div>
      </div>
    </div>
  </div>`
})
];

document.getElementById('root').innerHTML=posters.join('\n');
</script>
