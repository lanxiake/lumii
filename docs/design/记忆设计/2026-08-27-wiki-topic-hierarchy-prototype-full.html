<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki 用途目录 · 一期原型</title>
<style>
:root {
  --color-bg-primary: #0f172a;
  --color-bg-secondary: #1e293b;
  --color-bg-tertiary: #334155;
  --color-bg-hover: #475569;
  --color-bg-active: #334155;
  --color-text-primary: #f8fafc;
  --color-text-secondary: #94a3b8;
  --color-text-tertiary: #64748b;
  --color-text-disabled: #475569;
  --color-border: #334155;
  --color-border-light: #475569;
  --color-primary: #6366f1;
  --color-primary-hover: #4f46e5;
  --color-primary-bg: rgba(99, 102, 241, 0.14);
  --color-info: #3b82f6;
  --color-success: #22c55e;
  --color-success-bg: rgba(34, 197, 94, 0.12);
  --color-warning: #f59e0b;
  --color-warning-bg: rgba(245, 158, 11, 0.12);
  --color-error: #ef4444;
  --color-error-bg: rgba(239, 68, 68, 0.12);
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-full: 9999px;
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.28), 0 8px 10px -6px rgb(0 0 0 / 0.22);
  --transition-fast: 100ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  --font-family-sans: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
  --z-overlay: 1300;
  --z-modal: 1400;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-family-sans);
  background: var(--color-bg-primary);
  color: var(--color-text-primary);
  font-size: 13px;
  line-height: 1.5;
}

button, input { font-family: inherit; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

.wiki-tab {
  display: flex;
  height: 100%;
  overflow: hidden;
}

/* ---- 左栏 ---- */
.wiki-left-nav {
  display: flex;
  flex-direction: column;
  width: 228px;
  flex-shrink: 0;
  border-right: 1px solid var(--color-border);
  padding: 12px 8px;
  background: var(--color-bg-primary);
  min-height: 0;
}

.wiki-left-nav-search {
  padding: 0 4px 10px;
  border-bottom: 1px solid var(--color-border);
  margin-bottom: 8px;
}

.wiki-left-nav-search input {
  width: 100%;
  padding: 7px 10px;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-text-primary);
  font-size: 12px;
  outline: none;
}
.wiki-left-nav-search input:focus { border-color: var(--color-primary); }
.wiki-left-nav-search input::placeholder { color: var(--color-text-tertiary); }

.wiki-left-nav-primary {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--color-border);
  margin-bottom: 8px;
}

.wiki-left-nav-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border: none;
  background: transparent;
  border-radius: var(--radius-md);
  color: var(--color-text-secondary);
  cursor: pointer;
  text-align: left;
  width: 100%;
  transition: background var(--transition-fast);
}
.wiki-left-nav-item:hover { background: var(--color-bg-hover); }
.wiki-left-nav-item.active {
  background: var(--color-bg-active);
  color: var(--color-text-primary);
}
.wiki-nav-icon {
  width: 16px;
  height: 16px;
  margin-top: 1px;
  flex-shrink: 0;
  color: currentColor;
}
.wiki-nav-copy { flex: 1; min-width: 0; }
.wiki-nav-label { display: block; font-size: 13px; }
.wiki-left-nav-item.active .wiki-nav-label { font-weight: 500; }
.wiki-nav-hint {
  display: block;
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-top: 1px;
  line-height: 1.35;
}

.wiki-left-nav-count {
  margin-left: auto;
  padding: 1px 7px;
  border-radius: var(--radius-full);
  background: var(--color-bg-secondary);
  font-size: 11px;
  color: var(--color-text-tertiary);
  flex-shrink: 0;
  margin-top: 1px;
}
.wiki-left-nav-count.alert {
  background: var(--color-error-bg);
  color: var(--color-error);
}

.wiki-tree {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}
.wiki-tree-category { margin-bottom: 2px; }
.wiki-tree-category-row {
  display: flex;
  align-items: center;
  gap: 2px;
}
.wiki-tree-category-head {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px 6px 4px;
  border: none;
  flex: 1;
  min-width: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--color-text-primary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  text-align: left;
}
.wiki-tree-category-head:hover { background: var(--color-bg-hover); }
.wiki-tree-category-head.active {
  background: var(--color-bg-active);
}
.wiki-tree-chevron {
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--color-text-tertiary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
}
.wiki-tree-chevron:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
.wiki-tree-chevron svg { transition: transform var(--transition-normal); }
.wiki-tree-category.collapsed .wiki-tree-chevron svg { transform: rotate(-90deg); }
.wiki-tree-category-head .count,
.wiki-tree-subtopic .count {
  margin-left: auto;
  font-size: 11px;
  color: var(--color-text-tertiary);
  font-weight: 400;
}

.wiki-tree-subtopics { padding-left: 22px; }
.wiki-tree-category.collapsed .wiki-tree-subtopics { display: none; }
.wiki-tree-subtopic {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border: none;
  width: 100%;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
  font-size: 13px;
  text-align: left;
}
.wiki-tree-subtopic:hover { background: var(--color-bg-hover); }
.wiki-tree-subtopic.active {
  background: var(--color-bg-active);
  color: var(--color-text-primary);
  font-weight: 500;
}
.wiki-tree-subtopic.empty { color: var(--color-text-disabled); }

.wiki-left-nav-footer {
  position: relative;
  padding-top: 8px;
  margin-top: auto;
  border-top: 1px solid var(--color-border);
}
.wiki-more-menu {
  position: absolute;
  bottom: 48px;
  left: 8px;
  z-index: var(--z-overlay);
  width: 248px;
  padding: 6px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-bg-secondary);
  box-shadow: var(--shadow-xl);
  display: none;
}
.wiki-more-menu.open { display: block; }
.wiki-more-menu-item {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 9px 12px;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  cursor: pointer;
  text-align: left;
}
.wiki-more-menu-item:hover { background: var(--color-bg-hover); }
.wiki-more-menu-item .title { font-size: 13px; color: var(--color-text-primary); font-weight: 500; }
.wiki-more-menu-item .desc { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }

/* ---- 主区 ---- */
.wiki-tab-right {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
.wiki-main-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 24px 10px;
  border-bottom: 1px solid var(--color-border);
}
.wiki-header-copy { flex: 1; min-width: 0; }
.wiki-breadcrumb {
  font-size: 15px;
  font-weight: 600;
  color: var(--color-text-primary);
}
.wiki-breadcrumb .cat { color: var(--color-text-secondary); font-weight: 500; }
.wiki-breadcrumb .sep { color: var(--color-text-tertiary); margin: 0 6px; font-weight: 400; }
.wiki-page-subtitle {
  margin-top: 4px;
  font-size: 12px;
  color: var(--color-text-tertiary);
}

.wiki-task-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border);
  background: var(--color-primary-bg);
  color: var(--color-primary);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.wiki-task-pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--color-primary);
}

.wiki-chip-row {
  display: flex;
  gap: 6px;
  padding: 10px 24px 0;
}
.wiki-chip {
  padding: 4px 10px;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-text-secondary);
  font-size: 12px;
  cursor: pointer;
}
.wiki-chip:hover { background: var(--color-bg-secondary); color: var(--color-text-primary); }
.wiki-chip.active {
  background: var(--color-primary-bg);
  border-color: transparent;
  color: var(--color-text-primary);
}

.wiki-main-content {
  flex: 1;
  overflow-y: auto;
  padding: 8px 20px 24px;
}

.wiki-section-label {
  padding: 14px 12px 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-text-tertiary);
  text-transform: none;
}

.wiki-file-row,
.wiki-inbox-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
}
.wiki-file-row:hover,
.wiki-inbox-row:hover { background: var(--color-bg-secondary); }
.wiki-inbox-row {
  margin-bottom: 4px;
  border: 1px solid var(--color-border);
  background: var(--color-bg-secondary);
}

.wiki-file-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--color-bg-tertiary);
  color: var(--color-text-secondary);
}
.wiki-file-icon.image { background: rgba(59, 130, 246, 0.16); color: var(--color-info); }
.wiki-file-icon.av { background: var(--color-primary-bg); color: var(--color-primary); }
.wiki-file-info { flex: 1; min-width: 0; }
.wiki-file-name {
  font-size: 13px;
  color: var(--color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wiki-file-meta {
  font-size: 11px;
  color: var(--color-text-tertiary);
  margin-top: 2px;
}
.wiki-file-actions { display: flex; gap: 6px; flex-shrink: 0; }

.wiki-status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.wiki-status-dot.pending { background: var(--color-warning); }
.wiki-status-dot.processing { background: var(--color-primary); }
.wiki-status-dot.failed { background: var(--color-error); }

.btn {
  padding: 6px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-bg-secondary);
  color: var(--color-text-secondary);
  font-size: 12px;
  cursor: pointer;
}
.btn:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
.btn.primary {
  background: var(--color-primary);
  color: #fff;
  border-color: var(--color-primary);
}
.btn.primary:hover { background: var(--color-primary-hover); }
.btn.small { padding: 4px 10px; font-size: 11px; }
.btn.ghost { background: transparent; }

.wiki-empty-hint {
  padding: 72px 24px;
  text-align: center;
  color: var(--color-text-tertiary);
}
.wiki-empty-hint .text { font-size: 13px; line-height: 1.7; max-width: 360px; margin: 0 auto; }

.wiki-graph {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 16px 8px;
}
.wiki-graph-node {
  min-width: 140px;
  padding: 12px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-bg-secondary);
}
.wiki-graph-node .k { font-size: 12px; font-weight: 600; color: var(--color-text-primary); }
.wiki-graph-node .v { font-size: 11px; color: var(--color-text-tertiary); margin-top: 6px; }

/* ---- 选择器 / 抽屉 / Toast ---- */
.wiki-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: var(--z-modal);
}
.wiki-modal-overlay.open { display: flex; }
.wiki-modal {
  width: 440px;
  max-width: calc(100vw - 32px);
  max-height: 80vh;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-xl);
}
.wiki-modal-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.wiki-modal-header .title { font-weight: 600; font-size: 15px; }
.wiki-modal-header .sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 4px; }
.wiki-modal-close {
  border: none; background: transparent; color: var(--color-text-tertiary);
  font-size: 18px; cursor: pointer; line-height: 1; padding: 4px;
}
.wiki-modal-body { padding: 8px; overflow-y: auto; flex: 1; }
.wiki-modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--color-border);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.wiki-pick-item {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: inherit;
  cursor: pointer;
  text-align: left;
}
.wiki-pick-item:hover { background: var(--color-bg-hover); }
.wiki-pick-item .name { font-size: 13px; color: var(--color-text-primary); font-weight: 500; }
.wiki-pick-item .hint { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }

.wiki-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 360px;
  max-width: 100vw;
  background: var(--color-bg-secondary);
  border-left: 1px solid var(--color-border);
  z-index: var(--z-modal);
  display: none;
  flex-direction: column;
  box-shadow: var(--shadow-xl);
}
.wiki-drawer.open { display: flex; }
.wiki-drawer-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}
.wiki-drawer-body { padding: 8px 12px; overflow-y: auto; }
.wiki-task-item { padding: 12px; }
.wiki-task-item .t { font-size: 13px; color: var(--color-text-primary); }
.wiki-task-item .d { font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px; }

.wiki-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: var(--z-overlay);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-xl);
  font-size: 13px;
  display: none;
  max-width: 360px;
}
.wiki-toast.open { display: block; }

@media (max-width: 768px) {
  .wiki-left-nav { width: 64px; padding: 12px 6px; }
  .wiki-nav-hint, .wiki-left-nav-search, .wiki-left-nav-count,
  .wiki-tree-subtopics, .wiki-nav-label, .wiki-tree-category-head .count { display: none; }
  .wiki-left-nav-item, .wiki-tree-category-head { justify-content: center; padding: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="wiki-tab">
  <nav class="wiki-left-nav" aria-label="Wiki 目录">
    <div class="wiki-left-nav-search">
      <input type="search" id="searchInput" placeholder="搜索资料…" aria-label="搜索资料" oninput="handleSearch(this.value)">
    </div>

    <div class="wiki-left-nav-primary">
      <button type="button" class="wiki-left-nav-item" data-nav="inbox" onclick="showInbox()">
        <svg class="wiki-nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="wiki-nav-copy">
          <span class="wiki-nav-label">待整理</span>
          <span class="wiki-nav-hint">系统还没分好</span>
        </span>
        <span class="wiki-left-nav-count alert" id="inboxBadge">0</span>
      </button>
      <button type="button" class="wiki-left-nav-item" data-nav="parking" onclick="showParking()">
        <svg class="wiki-nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 12V5.5L8 3l5 2.5V12" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 12h10M8 7v5" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="wiki-nav-copy">
          <span class="wiki-nav-label">临时存放</span>
          <span class="wiki-nav-hint">你先搁这儿</span>
        </span>
        <span class="wiki-left-nav-count" id="parkingBadge">0</span>
      </button>
      <button type="button" class="wiki-left-nav-item" data-nav="graph" onclick="showGraph()">
        <svg class="wiki-nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="4" cy="4" r="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="5" r="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="12" r="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M5.4 4.8l5.2.6M4.8 5.6l2.4 5M11.2 6.4L9.2 10.6" stroke="currentColor" stroke-width="1.2"/></svg>
        <span class="wiki-nav-copy">
          <span class="wiki-nav-label">知识图谱</span>
          <span class="wiki-nav-hint">看关系，归档走左边</span>
        </span>
      </button>
    </div>

    <div class="wiki-tree" id="tree"></div>

    <div class="wiki-left-nav-footer">
      <button type="button" class="wiki-left-nav-item" onclick="toggleMoreMenu()">
        <svg class="wiki-nav-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.5" cy="8" r="1.2"/></svg>
        <span class="wiki-nav-copy"><span class="wiki-nav-label">更多</span></span>
      </button>
      <div class="wiki-more-menu" id="moreMenu" role="menu">
        <button type="button" class="wiki-more-menu-item" role="menuitem" onclick="showCleanup()">
          <span class="title">清理资料</span>
          <span class="desc">找出失效或重复的文件</span>
        </button>
        <button type="button" class="wiki-more-menu-item" role="menuitem" onclick="rebuildIndex()">
          <span class="title">重建索引</span>
          <span class="desc">刷新搜索</span>
        </button>
        <button type="button" class="wiki-more-menu-item" role="menuitem" onclick="showHistory()">
          <span class="title">历史页面</span>
          <span class="desc">旧版摘要页，只读</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="wiki-tab-right">
    <header class="wiki-main-header">
      <div class="wiki-header-copy">
        <div class="wiki-breadcrumb" id="mainTitle"></div>
        <div class="wiki-page-subtitle" id="mainSubtitle"></div>
      </div>
      <button type="button" class="wiki-task-pill" id="taskPill" onclick="toggleTaskCenter()">
        <span class="dot"></span>
        <span>归档中 2/5</span>
      </button>
    </header>
    <div class="wiki-chip-row" id="chipRow" hidden></div>
    <div class="wiki-main-content" id="mainContent"></div>
  </div>
</div>

<div class="wiki-modal-overlay" id="pickerOverlay" onclick="onOverlayClick(event, closePicker)">
  <div class="wiki-modal" role="dialog" aria-labelledby="pickerTitle" aria-modal="true">
    <div class="wiki-modal-header">
      <div>
        <div class="title" id="pickerTitle">放到哪一类</div>
        <div class="sub" id="pickerSub">按这份文件拿来干什么选，不要按学科</div>
      </div>
      <button type="button" class="wiki-modal-close" onclick="closePicker()" aria-label="关闭">✕</button>
    </div>
    <div class="wiki-modal-body" id="pickerBody"></div>
    <div class="wiki-modal-footer" id="pickerFooter"></div>
  </div>
</div>

<aside class="wiki-drawer" id="taskCenter" aria-label="任务中心">
  <div class="wiki-drawer-head">
    任务中心
    <button type="button" class="wiki-modal-close" onclick="toggleTaskCenter()" aria-label="关闭">✕</button>
  </div>
  <div class="wiki-drawer-body">
    <div class="wiki-section-label">进行中</div>
    <div class="wiki-task-item">

/** 展示用：大类与小类之间用空格斜杠，小类内部的 / 不拆。 */
function formatTopic(category, subtopic) {
  return subtopic ? category + '  /  ' + subtopic : category;
}

function countCategory(name) {
  return sources.filter((s) => s.category === name).length;
}

function countSubtopic(category, subtopic) {
  return sources.filter((s) => s.category === category && s.subtopic === subtopic).length;
}

function inboxCount() {
  return inboxQueue.length + unfiled.length;
}

function findCategory(name) {
  return TOPIC_TREE.find((c) => c.name === name);
}

function fileIcon(mediaType) {
  const svg = {
    document: '<rect x="4" y="2" width="8" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M6 6h4M6 9h3" stroke="currentColor" stroke-width="1.2"/>',
    image: '<rect x="3" y="4" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="7" r="1" fill="currentColor"/><path d="M5 12l3-3 4 3" stroke="currentColor" stroke-width="1.2"/>',
    av: '<circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M7 6l4 2-4 2V6z" fill="currentColor"/>'
  };
  return '<div class="wiki-file-icon ' + mediaType + '"><svg width="16" height="16" viewBox="0 0 16 16" fill="none">' + svg[mediaType] + '</svg></div>';
}

function showToast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('open');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('open'), 2400);
}

/** 刷新角标、树高亮，再画主区。 */
function render() {
  document.getElementById('inboxBadge').textContent = String(inboxCount());
  document.getElementById('parkingBadge').textContent = String(parking.length);
  renderTree();
  syncNavActive();
  renderMain();
}

/** 左栏用途树：点大类名列出该大类全部文件；chevron 只折叠。 */
function renderTree() {
  const tree = document.getElementById('tree');
  const prevCollapsed = new Set(
    [...tree.querySelectorAll('.wiki-tree-category.collapsed')].map((el) => el.dataset.cat)
  );
  tree.innerHTML = '';

  TOPIC_TREE.forEach((cat) => {
    const wrap = document.createElement('div');
    wrap.className = 'wiki-tree-category' + (prevCollapsed.has(cat.name) ? ' collapsed' : '');
    wrap.dataset.cat = cat.name;

    const row = document.createElement('div');
    row.className = 'wiki-tree-category-row';

    const chevron = document.createElement('button');
    chevron.type = 'button';
    chevron.className = 'wiki-tree-chevron';
    chevron.title = '折叠';
    chevron.setAttribute('aria-label', '折叠 ' + cat.name);
    chevron.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 7l3-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
    chevron.onclick = (e) => {
      e.stopPropagation();
      wrap.classList.toggle('collapsed');
    };

    const nameBtn = document.createElement('button');
    nameBtn.type = 'button';
    nameBtn.className = 'wiki-tree-category-head';
    if (ui.view === 'category' && ui.category === cat.name) nameBtn.classList.add('active');
    nameBtn.innerHTML = '<span>' + cat.name + '</span><span class="count">' + countCategory(cat.name) + '</span>';
    nameBtn.onclick = () => selectCategory(cat.name);

    row.appendChild(chevron);
    row.appendChild(nameBtn);
    wrap.appendChild(row);

    const subs = document.createElement('div');
    subs.className = 'wiki-tree-subtopics';
    cat.subtopics.forEach((sub) => {
      const count = countSubtopic(cat.name, sub);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wiki-tree-subtopic' + (count === 0 ? ' empty' : '');
      if (ui.view === 'subtopic' && ui.category === cat.name && ui.subtopic === sub) btn.classList.add('active');
      btn.innerHTML = '<span>' + sub + '</span>' + (count ? '<span class="count">' + count + '</span>' : '');
      btn.onclick = () => selectSubtopic(cat.name, sub);
      subs.appendChild(btn);
    });
    wrap.appendChild(subs);
    tree.appendChild(wrap);
  });
}

function syncNavActive() {
  document.querySelectorAll('.wiki-left-nav-item[data-nav]').forEach((el) => {
    el.classList.toggle('active', el.dataset.nav === ui.view);
  });
}

function rememberBrowse() {
  lastBrowse = { view: ui.view, category: ui.category, subtopic: ui.subtopic };
}

function selectCategory(category) {
  ui = { view: 'category', category, subtopic: null, mediaType: 'all', query: '' };
  rememberBrowse();
  document.getElementById('searchInput').value = '';
  render();
}

function selectSubtopic(category, subtopic) {
  ui = { view: 'subtopic', category, subtopic, mediaType: 'all', query: '' };
  rememberBrowse();
  document.getElementById('searchInput').value = '';

}

function closeMore() {

}

function toggleMoreMenu() {
  document.getElementById('moreMenu').classList.toggle('open');
}

function toggleTaskCenter() {
  document.getElementById('taskCenter').classList.toggle('open');
}

function rebuildIndex() {
  closeMore();
  showToast('已开始重建索引，进度看右上角任务');
}

/** 按当前视图列出文件，并用媒体芯片筛选（不改目录）。 */
function listedSources() {
  let list = sources;
  if (ui.view === 'category') list = sources.filter((s) => s.category === ui.category);
  if (ui.view === 'subtopic') list = sources.filter((s) => s.category === ui.category && s.subtopic === ui.subtopic);
  if (ui.mediaType !== 'all') list = list.filter((s) => s.mediaType === ui.mediaType);
  return list;
}

function setTitle(titleHtml, subtitle) {
  document.getElementById('mainTitle').innerHTML = titleHtml;
  document.getElementById('mainSubtitle').textContent = subtitle || '';
}

function renderChips(visible) {
  const row = document.getElementById('chipRow');
  if (!visible) {
    row.hidden = true;
    row.innerHTML = '';
    return;
  }
  row.hidden = false;
  const chips = [
    ['all', '全部'],
    ['document', '文档'],
    ['image', '图片'],
    ['av', '音视频']
  ];
  row.innerHTML = chips.map(([id, label]) =>
    '<button type="button" class="wiki-chip' + (ui.mediaType === id ? ' active' : '') + '" onclick="setMedia(\'' + id + '\')">' + label + '</button>'
  ).join('');
}

function setMedia(mediaType) {
  ui.mediaType = mediaType;
  render();
}

function fileActions(file, extras) {
  return (
    '<div class="wiki-file-actions">' +
      '<button type="button" class="btn primary small" onclick="openFile(\'' + escapeAttr(file.name) + '\')">打开</button>' +
      extras +
    '</div>'
  );
}

function fileRow(file, extras, metaPrefix) {
  const meta = (metaPrefix ? metaPrefix + ' · ' : '') + MEDIA_LABEL[file.mediaType] + ' · ' + file.updated;
  return (
    '<div class="wiki-file-row">' +
      fileIcon(file.mediaType) +
      '<div class="wiki-file-info">' +
        '<div class="wiki-file-name">' + escapeHtml(file.name) + '</div>' +
        '<div class="wiki-file-meta">' + meta + '</div>' +
      '</div>' +
      fileActions(file, extras) +
    '</div>'
  );
}

function emptyHint(text) {
  return '<div class="wiki-empty-hint"><div class="text">' + text + '</div></div>';
}

function renderMain() {
  const content = document.getElementById('mainContent');

  if (ui.view === 'inbox') {
    renderChips(false);
    setTitle('待整理', '系统还在归档或无法自动归类的文件。不是你主动搁置的那堆。');
    content.innerHTML =
      '<div class="wiki-section-label">队列</div>' +
      (inboxQueue.map(inboxRow).join('') || emptyHint('队列是空的')) +
      '<div class="wiki-section-label">待补分</div>' +
      (unfiled.map(unfiledRow).join('') || emptyHint('没有待补分的旧文件'));
    return;
  }

  if (ui.view === 'parking') {
    renderChips(true);
    setTitle('临时存放', '你主动搁置、暂不进入正式目录的文件。系统不会往这里归档。');
    const list = ui.mediaType === 'all' ? parking : parking.filter((f) => f.mediaType === ui.mediaType);
    content.innerHTML = list.length
      ? list.map((f) => fileRow(f,
          '<button type="button" class="btn small" onclick="openPicker(\'parking\',' + f.id + ')">移出</button>'
        )).join('')
      : emptyHint('没有临时存放的文件');
    return;
  }

  if (ui.view === 'graph') {
    renderChips(false);
    setTitle('知识图谱', '这里看文件之间的关系。新文件请从左边目录放进去。');
    content.innerHTML =
      '<div class="wiki-graph">' +
        TOPIC_TREE.map((c) =>
          '<div class="wiki-graph-node"><div class="k">' + c.name + '</div><div class="v">' + countCategory(c.name) + ' 个文件 · ' + c.hint + '</div></div>'
        ).join('') +
      '</div>' +
      '<p class="wiki-page-subtitle" style="padding:0 8px;">点左边大类或小类，打开的是原文件，不是这张图。</p>';
    return;
  }

  if (ui.view === 'cleanup') {
    renderChips(false);
    setTitle('清理资料', '扫描失效路径或重复文件。一期动作会写回用途两列。');
    content.innerHTML =
      '<div class="wiki-empty-hint"><div class="text">还没有需要清理的项。<br>扫描完成后会出现在这里。</div></div>';
    return;
  }

  if (ui.view === 'history') {
    renderChips(false);
    setTitle('历史页面', '旧版摘要页，只读。新资料请从左边目录打开原文件。');
    content.innerHTML = HISTORY_PAGES.map((p) =>
      '<div class="wiki-file-row">' +
        fileIcon('document') +
        '<div class="wiki-file-info"><div class="wiki-file-name">' + escapeHtml(p.title) + '</div>' +
        '<div class="wiki-file-meta">' + p.path + ' · ' + p.updated + '</div></div>' +
      '</div>'
    ).join('');
    return;
  }

  if (ui.view === 'search') {
    renderChips(false);
    const q = ui.query.toLowerCase();
    const results = sources.filter((s) =>
      s.name.toLowerCase().includes(q) ||
      s.category.toLowerCase().includes(q) ||
      s.subtopic.toLowerCase().includes(q)
    );
    setTitle('搜索「' + escapeHtml(ui.query) + '」', '找到 ' + results.length + ' 项 · 点结果即打开原文件');
    content.innerHTML = results.length
      ? results.map((f) => fileRow(
          f,
          '<button type="button" class="btn small" onclick="openPicker(\'source\',' + f.id + ')">移动</button>',
          formatTopic(f.category, f.subtopic)
        )).join('')
      : emptyHint('没有找到匹配的文件');
    return;
  }

  renderChips(true);
  const list = listedSources();
  if (ui.view === 'category') {
    setTitle('<span class="cat">' + ui.category + '</span>', '该用途下的全部文件');
  } else {
    setTitle('<span class="cat">' + ui.category + '</span><span class="sep">/</span>' + ui.subtopic, '点文件名即可打开原文');
  }
  const extras = (f) =>
    '<button type="button" class="btn small" onclick="openPicker(\'source\',' + f.id + ')">移动</button>' +
    '<button type="button" class="btn small ghost" onclick="moveToParking(' + f.id + ')">存到临时存放</button>';
  content.innerHTML = list.length
    ? list.map((f) => fileRow(f, extras(f))).join('')
    : emptyHint(ui.view === 'subtopic' ? '这个小类下还没有文件' : '这个用途下还没有文件');
}

function inboxRow(item) {
  const actions = item.status === 'processing'
    ? ''
    : '<button type="button" class="btn primary small" onclick="openPicker(\'inbox\',' + item.id + ')">归档到…</button>' +
      (item.status === 'failed'
        ? '<button type="button" class="btn small" onclick="showToast(\'将重试提取内容\')">重试</button>' +
          '<button type="button" class="btn small" onclick="discardInbox(' + item.id + ')">丢弃</button>'
        : '');
  return (
    '<div class="wiki-inbox-row">' +
      '<span class="wiki-status-dot ' + item.status + '"></span>' +
      '<div class="wiki-file-info"><div class="wiki-file-name">' + escapeHtml(item.name) + '</div>' +
      '<div class="wiki-file-meta">' + item.statusText + '</div></div>' +
      '<div class="wiki-file-actions">' + actions + '</div></div>'
  );
}

function unfiledRow(item) {
  return (
    '<div class="wiki-inbox-row">' +
      fileIcon(item.mediaType) +
      '<div class="wiki-file-info"><div class="wiki-file-name">' + escapeHtml(item.name) + '</div>' +
      '<div class="wiki-file-meta">已入库，还没分用途</div></div>' +
      '<div class="wiki-file-actions">' +
        '<button type="button" class="btn primary small" onclick="openPicker(\'unfiled\',' + item.id + ')">归档到…</button>' +
      '</div></div>'
  );
}

function handleSearch(value) {
  const q = value.trim();
  if (!q) {
    ui = { ...lastBrowse, mediaType: 'all', query: '' };
    render();
    return;
  }
  if (ui.view !== 'search') {
    lastBrowse = { view: ui.view, category: ui.category, subtopic: ui.subtopic };
  }
  ui = { view: 'search', category: null, subtopic: null, mediaType: 'all', query: q };
  render();
}

function openFile(name) {
  showToast('打开原文件：' + name);
}

function moveToParking(id) {
  const idx = sources.findIndex((s) => s.id === id);
  if (idx < 0) return;
  const file = sources.splice(idx, 1)[0];
  parking.push({ id: file.id, name: file.name, mediaType: file.mediaType, updated: '刚刚' });
  showToast('已放到临时存放');
  render();
}

/**
 * 打开两步目录选择器。inbox 归档不能写入临时存放。
 * kind: source | inbox | unfiled | parking
 */
function openPicker(kind, id) {
  picker = { kind, id, step: 1, category: null };
  document.getElementById('pickerOverlay').classList.add('open');
  renderPicker();
}

function closePicker() {
  picker = null;
  document.getElementById('pickerOverlay').classList.remove('open');
}

function onOverlayClick(event, closeFn) {
  if (event.target.id === 'pickerOverlay') closeFn();
}

function renderPicker() {
  const title = document.getElementById('pickerTitle');
  const sub = document.getElementById('pickerSub');
  const body = document.getElementById('pickerBody');
  const footer = document.getElementById('pickerFooter');
  const allowParking = picker.kind === 'source' || picker.kind === 'parking';

  if (picker.step === 1) {
    title.textContent = '放到哪一类';
    sub.textContent = '按这份文件拿来干什么选，不要按学科';
    body.innerHTML = TOPIC_TREE.map((c) =>
      '<button type="button" class="wiki-pick-item" onclick="pickCategory(\'' + c.name + '\')">' +
        '<span class="name">' + c.name + '</span>' +
        '<span class="hint">' + c.hint + '</span>' +
      '</button>'
    ).join('');
    footer.innerHTML =
      '<button type="button" class="btn ghost" onclick="closePicker()">取消</button>' +
      (allowParking && picker.kind === 'source'
        ? '<button type="button" class="btn" onclick="confirmParkingFromPicker()">放到临时存放</button>'
        : '<span></span>');
    return;
  }

  const cat = findCategory(picker.category);
  title.textContent = cat.name;
  sub.textContent = cat.hint + ' · 选一个小类';
  body.innerHTML = cat.subtopics.map((s, index) =>
    '<button type="button" class="wiki-pick-item" onclick="confirmTopicByIndex(' + index + ')">' +
      '<span class="name">' + escapeHtml(s) + '</span>' +
    '</button>'
  ).join('');
  footer.innerHTML =
    '<button type="button" class="btn ghost" onclick="pickerBack()">返回大类</button><span></span>';
}

function pickCategory(name) {
  picker.category = name;
  picker.step = 2;
  renderPicker();
}

function pickerBack() {
  picker.step = 1;
  picker.category = null;
  renderPicker();
}

function confirmParkingFromPicker() {
  moveToParking(picker.id);
  closePicker();
}

/** 用当前大类下的小类下标确认，避免名称里的 / 或 & 进入 onclick。 */
function confirmTopicByIndex(index) {
  const cat = findCategory(picker.category);
  confirmTopic(cat.subtopics[index]);
}

/** 用 category + subtopic 两字段写入，绝不拼接后再 split。 */
function confirmTopic(subtopic) {
  const category = picker.category;
  const { kind, id } = picker;

  if (kind === 'source') {
    const file = sources.find((s) => s.id === id);
    if (file) { file.category = category; file.subtopic = subtopic; }
  } else if (kind === 'parking') {
    const idx = parking.findIndex((s) => s.id === id);
    if (idx >= 0) {
      const file = parking.splice(idx, 1)[0];
      sources.push({ ...file, category, subtopic, updated: '刚刚' });
    }
  } else if (kind === 'inbox') {
    const idx = inboxQueue.findIndex((s) => s.id === id);
    if (idx >= 0) {
      const item = inboxQueue.splice(idx, 1)[0];
      sources.push({
        id: item.id, name: item.name, category, subtopic,
        mediaType: 'document', updated: '刚刚'
      });
    }
  } else if (kind === 'unfiled') {
    const idx = unfiled.findIndex((s) => s.id === id);
    if (idx >= 0) {
      const file = unfiled.splice(idx, 1)[0];
      sources.push({ ...file, category, subtopic, updated: '刚刚' });
    }
  }

  closePicker();
  showToast('已放到 ' + formatTopic(category, subtopic));
  render();
}

function discardInbox(id) {
  inboxQueue = inboxQueue.filter((i) => i.id !== id);
  showToast('已丢弃');
  render();
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function escapeAttr(text) {
  return escapeHtml(text).replace(/'/g, '\\\'');
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closePicker();
  document.getElementById('taskCenter').classList.remove('open');
  closeMore();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.wiki-left-nav-footer')) closeMore();
});

render();
</script>
</body>
</html>
