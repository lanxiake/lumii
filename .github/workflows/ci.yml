name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 无依赖，秒级完成：拦截"已拆分的大文件重新膨胀"
  large-files:
    name: 超大文件守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-large-files.mjs

  # 需要装依赖；用 windows-latest 与开发环境保持一致
  # （apps/windows 依赖 Windows 专属的原生包，Linux 上安装行为未经验证）
  typecheck:
    name: 类型检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --ignore-scripts 跳过 electron-rebuild 等原生模块编译：
      # 类型检查只需要声明文件，不需要可运行的二进制。
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      # 2026-09-24 新增：接线守卫（node scripts/check-wiring.mjs）。
      # 抓的是 tsc 与单测都看不见的「写了一半没接上」：main 注册了 handler 但 preload
      # 从不 invoke、preload 引用了但 main 没实现（调用必然 reject）、工具导出没进
      # ALL_BUILT_IN_TOOL_CONFIGS、以及从入口走不到的文件。
      # 走棘轮：存量断线记在 scripts/wiring-baseline.json，只拦截新增。
      # 放在这个 job 而非独立 job，是因为它需要 typescript 包（AST 解析），
      # 这里已经装好了，单开 job 要再付一次 install。
      - run: pnpm check:wiring

  # 2026-09-18 新增：此前 CI 一个测试都没跑，packages/agent-runtime 的
  # 212 个文件 / 2153 个用例（含工具面守卫）全靠人记得在本地跑。
  # 该包零原生依赖：better-sqlite3 是 Electron ABI，测试助手
  # (src/__tests__/helpers/sqlite-test-db.ts) 会自动回退到 node:sqlite。
  # ⚠️ 不要覆盖 vitest 的 pool —— 配置里用 forks + --experimental-sqlite，
  #    Node 22 下 node:sqlite 仍需该 flag，56 个 DB 测试依赖它。
  # ⚠️ apps/windows 的测试不在此 job：该套件有已知摆动用例（见 AGENTS.md），
  #    做 CI 门禁会产生假红；它仍由提交前的 pnpm verify 覆盖。
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @mtbot/agent-runtime test
      # 2026-09-20 新增：pet-core 的套件此前**能跑但没人跑** ——
      # 既未接入本 workflow，也未接入根 pnpm verify，等于没有防线。
      # 该包是纯 TS（零原生依赖、零 I/O），用例确定性强、秒级完成，适合做 CI 门禁。
      - run: pnpm --filter @mtbot/pet-core test
      # 2026-09-20 新增：pet-asset（宠物素材工具链）的两段式安装与路径越界防线。
      # 依赖 sharp，但它的原生二进制来自预编译可选依赖 @img/sharp-win32-x64
      # （该包无 install 脚本），所以上面的 --ignore-scripts 不影响它加载。
      # 用例全部在临时目录里跑，不碰用户目录。
      - run: pnpm --filter @mtbot/pet-asset test
