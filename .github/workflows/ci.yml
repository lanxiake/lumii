name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 无依赖，秒级完成：拦截"已拆分的大文件重新膨胀"
  large-files:
    name: 超大文件守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-large-files.mjs

  # 需要装依赖；用 windows-latest 与开发环境保持一致
  # （apps/windows 依赖 Windows 专属的原生包，Linux 上安装行为未经验证）
  typecheck:
    name: 类型检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --ignore-scripts 跳过 electron-rebuild 等原生模块编译：
      # 类型检查只需要声明文件，不需要可运行的二进制。
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      # 2026-09-24 新增：knip（模块图可达性 + 依赖卫生），与下面的接线守卫互补 ——
      # 守卫走 TS AST 抓「写了一半没接上」，knip 走模块图抓「写了但没人用」，
      # 且覆盖守卫扫不到的 packages/ 与依赖声明。
      # 走棘轮：预算 --max-issues 2，存量只有并行会话在改的 pet-lab/sprite-lab.ts
      # 与 isolated-vm（待决策）。exports/types 两类已升 error。
      # 同样放这个 job：它需要 node_modules 才能解析依赖。
      #
      # 为什么走 `pnpm dlx` 而不装成 devDependency：本仓任何 pnpm add 都会重算依赖图，
      # 把 pi-ai 的 zod peer 从 3.25.76 抬到 4.6.5，而本仓没有任何 package.json 声明
      # zod（它只是 pi-ai 的 peer），防不住。详见 knip.jsonc 顶部与计划文档 §4.2。
      # 实测开销：store 命中时含 dlx 重建共 7.1s（`downloaded 0`）；
      # 只有 CI 首次要下 ~21MB，之后由 setup-node 的 cache: pnpm 覆盖。
      - run: pnpm check:knip
      # 2026-09-24 新增：接线守卫（node scripts/check-wiring.mjs）。
      # 抓的是 tsc 与单测都看不见的「写了一半没接上」：main 注册了 handler 但 preload
      # 从不 invoke、preload 引用了但 main 没实现（调用必然 reject）、工具导出没进
      # ALL_BUILT_IN_TOOL_CONFIGS、以及从入口走不到的文件。
      # 走棘轮：存量断线记在 scripts/wiring-baseline.json，只拦截新增。
      # 放在这个 job 而非独立 job，是因为它需要 typescript 包（AST 解析），
      # 这里已经装好了，单开 job 要再付一次 install。
      - run: pnpm check:wiring

  # 2026-09-18 新增：此前 CI 一个测试都没跑，packages/agent-runtime 的
  # 212 个文件 / 2153 个用例（含工具面守卫）全靠人记得在本地跑。
  # 该包零原生依赖：better-sqlite3 是 Electron ABI，测试助手
  # (src/__tests__/helpers/sqlite-test-db.ts) 会自动回退到 node:sqlite。
  # ⚠️ 不要覆盖 vitest 的 pool —— 配置里用 forks + --experimental-sqlite，
  #    Node 22 下 node:sqlite 仍需该 flag，56 个 DB 测试依赖它。
  # ⚠️ apps/windows 的测试不在此 job：该套件有已知摆动用例（见 AGENTS.md），
  #    做 CI 门禁会产生假红；它仍由提交前的 pnpm verify 覆盖。
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @mtbot/agent-runtime test
      # 2026-09-20 新增：pet-core 的套件此前**能跑但没人跑** ——
      # 既未接入本 workflow，也未接入根 pnpm verify，等于没有防线。
      # 该包是纯 TS（零原生依赖、零 I/O），用例确定性强、秒级完成，适合做 CI 门禁。
      - run: pnpm --filter @mtbot/pet-core test
      # 2026-09-20 新增：pet-asset（宠物素材工具链）的两段式安装与路径越界防线。
      # 依赖 sharp，但它的原生二进制来自预编译可选依赖 @img/sharp-win32-x64
      # （该包无 install 脚本），所以上面的 --ignore-scripts 不影响它加载。
      # 用例全部在临时目录里跑，不碰用户目录。
      - run: pnpm --filter @mtbot/pet-asset test

  # 2026-10-09 新增：wechat-mcp 的**离线**回归（test_watch.py，A–I 九层 47 例）。
  #
  # 为什么只有它进 CI：这一目录下有三个 python 套件，只有这份是**夹具驱动、不碰真机**的
  # （文件头写着「不需要微信、不碰真实数据」）——覆盖重放/新鲜度护栏、镜像与水位、
  # 错误码对账、目标会话校验的证据强度、发送闸门、锁屏识别、读界面重试预算、画像 scope 语义。
  # test_automation.py 要读注册表与真实账号/会话（`core.list_accounts`、
  # `core.sessions`、真实数据目录），在 CI 上只会「因为没数据所以通过」，绿得没有意义；
  # 它们仍是本机跑的冒烟脚本（复现命令见 docs/wechat-mcp-optimization-plan.md 附录 A）。
  #
  # 这一套此前**能跑但没人跑**（既不在本 workflow 也不在 pnpm verify 里，与 pet-core 当初一样），
  # 等于没有防线：`read_ui_stable` 的重试预算、`verify_target` 的锚点否决这些改动，
  # 都是靠人记得在本地跑才发现的。
  #
  # windows-latest 而非 ubuntu：D–H 层要 import wechat_sender（`ctypes.wintypes`、`msvcrt`）。
  # python 版本对齐 App 内置的托管解释器（3.11.x），免得本地绿、CI 红。
  wechat-mcp:
    name: 微信 MCP 离线回归
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # A 层（真加密夹具，逐字节）要 AES。不给就整层跳过（套件自己会打印跳过），
      # 装的是纯 python 轮子，秒级。
      - run: python -m pip install --disable-pip-version-check pycryptodome
      - run: python apps/windows/resources/wechat-mcp/test_watch.py
      # mcp_stdio（四件套共用的协议层）：握手/协议版协商、工具错误码、isError、通知不回帧。
      # 协议循环原先在四个 server.py 里各一份，已踩过两次「手搓对不上 SDK」——收敛后这是唯一的哨位。
      - run: python apps/windows/resources/wechat-mcp/test_mcp_stdio.py
      # mcp_install（四件套共用的一键安装）：写别人配置文件的三条纪律（读不懂就不动、
      # 只增删自己的键、别人的内容一个字节不碰）+ 部署/技能包往返。全在临时目录里跑，
      # **不碰任何真实客户端配置**——所以 CI 上也能真跑。
      - run: python apps/windows/resources/wechat-mcp/test_mcp_install.py
      # mcp_license（四件套的授权门禁）：临时密钥对 + 临时目录，验「未授权必须被拦」与
      # **「已授权必须放行」**（误锁死收费产品同样是事故），以及 scope 分流。
      # 与 test_licensing.py 一样，门禁的失败模式全是静默放行，源码运行永远暴露不出来。
      - run: python apps/windows/resources/wechat-mcp/test_mcp_license.py
      # wechat-file-mcp（文件归档，独立小工具）：纯函数单测（解析/磁盘映射/归档路径）
      # + 真机只读冒烟（CI 无微信库时自己跳过，不会假绿）。
      - run: python apps/windows/resources/wechat-file-mcp/test_filecore.py
      # wechat-export-mcp（记录导出）：渲染/转义/代发标记/格式 纯函数测 + 真机只读导出冒烟（无库时跳过）。
      - run: python apps/windows/resources/wechat-export-mcp/test_exportcore.py
      # wechat-recall-mcp（撤回防护）：用**合成库**验撤回判定（删行/原地改写两种机制、
      # 假阳性防护、归档永不覆盖）+ 真机只读打底冒烟（无库时跳过）。
      - run: python apps/windows/resources/wechat-recall-mcp/test_recall.py
      # wechat-crm-mcp（客户分析）：联系人分类纯函数测 + 真机只读冒烟（通讯录/群成员/统计/排行，无库时跳过）。
      - run: python apps/windows/resources/wechat-crm-mcp/test_contactscore.py
      # 安装包里随的是独立 wechat-mcp.exe（PyInstaller 单文件）：构建脚本末尾自带 initialize 握手冒烟，
      # 能拦下「源码能跑、冻结后缺模块/缺随包数据」这一类只在 exe 里出现的问题。
      - uses: astral-sh/setup-uv@v5
      - run: node apps/windows/scripts/build-wechat-mcp.mjs
